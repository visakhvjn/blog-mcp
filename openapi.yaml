openapi: 3.1.1
info:
  title: Blog MCP API
  description: |
    REST API for managing blog posts and topics on Blog MCP.

    Generate an API key at `/dashboard/settings` after signing in, then pass it as
    `Authorization: Bearer blog_...` on every request.

    For Cursor and ChatGPT MCP connectors, use the MCP endpoint at `/api/mcp` instead.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: https://blog-mcp-five.vercel.app
    description: Production

security:
  - bearerAuth: []

paths:
  /api/posts:
    get:
      operationId: listPosts
      summary: List posts
      description: Returns all posts for the authenticated user, newest first.
      tags:
        - posts
      responses:
        "200":
          description: Post list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createPost
      summary: Create a post
      description: Creates a new markdown blog post. Slug is generated from the title if omitted.
      tags:
        - posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
            example:
              title: Hello world
              content: "# Hi\n\nMarkdown content."
              status: DRAFT
              excerpt: Optional short summary
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/posts/{id}:
    get:
      operationId: getPost
      summary: Get a post
      description: Returns a single post by MongoDB id.
      tags:
        - posts
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the post
          schema:
            type: string
      responses:
        "200":
          description: Post found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updatePost
      summary: Update a post
      description: Updates one or more fields on an existing post. Only include fields you want to change.
      tags:
        - posts
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the post
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
            example:
              status: PUBLISHED
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deletePost
      summary: Delete a post
      description: Permanently deletes a post by id.
      tags:
        - posts
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the post
          schema:
            type: string
      responses:
        "200":
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/topics:
    get:
      operationId: listTopics
      summary: List topics
      description: Returns all topics for the authenticated user, sorted by name.
      tags:
        - topics
      responses:
        "200":
          description: Topic list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createTopic
      summary: Create a topic
      description: Creates a topic to group related posts. Slug is generated from the name if omitted.
      tags:
        - topics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopicRequest"
            example:
              name: Engineering
              description: Long-form notes on building software.
      responses:
        "201":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/topics/{id}:
    get:
      operationId: getTopic
      summary: Get a topic
      description: Returns a single topic by MongoDB id.
      tags:
        - topics
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the topic
          schema:
            type: string
      responses:
        "200":
          description: Topic found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TopicNotFound"

    patch:
      operationId: updateTopic
      summary: Update a topic
      description: Updates one or more fields on an existing topic. Only include fields you want to change.
      tags:
        - topics
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the topic
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTopicRequest"
            example:
              name: Engineering notes
      responses:
        "200":
          description: Topic updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TopicNotFound"

    delete:
      operationId: deleteTopic
      summary: Delete a topic
      description: Permanently deletes a topic by id. Linked posts are unlinked, not deleted.
      tags:
        - topics
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the topic
          schema:
            type: string
      responses:
        "200":
          description: Topic deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TopicNotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API key from Dashboard → AI Publishing settings.
        Format: `Bearer blog_...`

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Unauthorized
    BadRequest:
      description: Invalid JSON or validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Post not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Post not found
    TopicNotFound:
      description: Topic not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Topic not found

  schemas:
    PostStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED

    PostSummary:
      type: object
      required:
        - id
        - title
        - slug
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
        status:
          $ref: "#/components/schemas/PostStatus"
        excerpt:
          type: string
          nullable: true
        topicId:
          type: string
          nullable: true
        topicName:
          type: string
          nullable: true
        topicSlug:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Post:
      type: object
      required:
        - id
        - userId
        - title
        - slug
        - content
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        topicId:
          type: string
          nullable: true
        title:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
        content:
          type: string
          description: Markdown body
        excerpt:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/PostStatus"
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePostRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 100000
          description: Markdown body
        excerpt:
          type: string
          maxLength: 500
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          maxLength: 80
          description: Optional custom slug; generated from title if omitted
        status:
          $ref: "#/components/schemas/PostStatus"
          default: DRAFT
        topicId:
          type: string
          description: Optional topic id to assign the post to

    UpdatePostRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 100000
        excerpt:
          type: string
          maxLength: 500
          nullable: true
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          maxLength: 80
        status:
          $ref: "#/components/schemas/PostStatus"
        topicId:
          type: string
          nullable: true
          description: Topic id to assign; null to remove from topic

    PostListResponse:
      type: object
      required:
        - posts
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/PostSummary"

    TopicSummary:
      type: object
      required:
        - id
        - name
        - slug
        - postCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
        description:
          type: string
          nullable: true
        postCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Topic:
      type: object
      required:
        - id
        - userId
        - name
        - slug
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTopicRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          maxLength: 80
          description: Optional custom slug; generated from name if omitted

    UpdateTopicRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          maxLength: 80

    TopicListResponse:
      type: object
      required:
        - topics
      properties:
        topics:
          type: array
          items:
            $ref: "#/components/schemas/TopicSummary"

    TopicResponse:
      type: object
      required:
        - topic
      properties:
        topic:
          $ref: "#/components/schemas/Topic"

    PostResponse:
      type: object
      required:
        - post
      properties:
        post:
          $ref: "#/components/schemas/Post"

    DeleteResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
